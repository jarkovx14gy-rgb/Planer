<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Planer 1B TECH</title>
<style>
:root{--ink:#182330;--muted:#748196;--line:#e6eaf0;--blue:#3858dc;--bg:#f5f7fb;--card:#fff;--shadow:0 18px 55px #1e2a4418}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.app{max-width:1120px;margin:auto;padding:32px 24px 56px}.top{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:28px}.brand{display:flex;align-items:center;gap:13px}.logo{width:44px;height:44px;border-radius:14px;background:#e9edff;color:var(--blue);display:grid;place-items:center;font-size:25px;font-weight:700}.eyebrow{font-size:11px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase}.brand h1{font-size:22px;line-height:1.2;margin:2px 0 0}.top-actions{display:flex;gap:10px}.button{border:1px solid var(--line);border-radius:11px;padding:10px 15px;background:white;color:var(--ink);font-weight:650;font-size:14px;cursor:pointer;transition:.15s}.button:hover{transform:translateY(-1px);box-shadow:0 6px 18px #1e2a4415}.button.primary{background:var(--blue);border-color:var(--blue);color:#fff}.button.plus{font-size:21px;padding:4px 13px;line-height:1.25}.headrow{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}.headrow h2{font-size:24px;margin:0}.monthnav{display:flex;align-items:center;gap:14px}.monthnav strong{min-width:155px;text-align:center;font-size:15px}.iconbtn{width:35px;height:35px;border:1px solid var(--line);border-radius:10px;background:white;cursor:pointer;font-size:17px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:20px}.calendar,.sidecard{background:var(--card);border:1px solid var(--line);border-radius:17px;box-shadow:var(--shadow)}.calendar{padding:16px}.weekdays,.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}.weekdays{padding-bottom:10px;border-bottom:1px solid var(--line);color:var(--muted);font-size:11px;text-align:center;text-transform:uppercase;letter-spacing:.06em}.day{min-height:110px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:8px 6px;cursor:pointer;transition:background .12s}.day:nth-child(7n){border-right:0}.day:hover{background:#f7f8ff}.day.other{color:#b5bdc9;background:#fcfcfd}.day.today .num{background:var(--blue);color:white}.num{width:26px;height:26px;display:grid;place-items:center;border-radius:50%;font-size:13px;margin-bottom:5px}.event{font-size:11px;line-height:1.3;padding:5px 6px;border-radius:7px;margin:3px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-left:3px solid #8192f5;background:#eef0ff;color:#303f9f}.event.sprawdzian{background:#fff0e9;border-color:#ef8a53;color:#a04b20}.event.praca{background:#f3ecff;border-color:#a47de6;color:#6741a4}.event.poprawa{background:#eaf7f0;border-color:#55ae7b;color:#267348}.event.lecture{background:#eaf5ff;border-color:#62a7de;color:#26648e}.sidecard{padding:19px;height:max-content}.sidecard h3{font-size:16px;margin:0 0 5px}.subtle{color:var(--muted);font-size:13px}.upcoming{margin-top:16px}.upcoming-item{border-top:1px solid var(--line);padding:12px 0;display:grid;grid-template-columns:48px 1fr;gap:9px}.datebox{height:43px;border-radius:10px;background:#f3f5fb;display:grid;place-content:center;text-align:center;font-size:11px;color:var(--muted)}.datebox b{font-size:16px;color:var(--ink)}.upcoming-item strong{font-size:13px;display:block}.upcoming-item small{color:var(--muted)}.empty{color:#9aa4b4;font-size:12px;padding:7px 2px}.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:14px;color:var(--muted);font-size:11px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#8192f5;margin-right:5px}.dot.orange{background:#ef8a53}.dot.purple{background:#a47de6}.dot.green{background:#55ae7b}.dot.sky{background:#62a7de}.hint{margin-top:12px;font-size:12px;color:var(--muted)}
.overlay{position:fixed;inset:0;background:#10182770;display:none;align-items:center;justify-content:center;padding:18px;z-index:5}.overlay.open{display:flex}.modal{width:min(100%,450px);background:white;border-radius:20px;padding:24px;box-shadow:0 28px 90px #0b122a55;animation:pop .16s ease-out}@keyframes pop{from{transform:translateY(8px);opacity:.5}to{transform:none;opacity:1}}.modalhead{display:flex;justify-content:space-between;align-items:start;margin-bottom:20px}.modalhead h2{font-size:20px;margin:0 0 4px}.close{border:0;background:#f2f4f8;border-radius:9px;width:32px;height:32px;font-size:19px;cursor:pointer}.field{margin:14px 0}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:7px}.field input,.field select{width:100%;border:1px solid #dce1e9;border-radius:10px;padding:11px 12px;background:white;color:var(--ink);font:inherit;outline:0}.field input:focus,.field select:focus{border-color:#8192f5;box-shadow:0 0 0 3px #8192f522}.subject-list{display:grid;grid-template-columns:1fr 1fr;gap:7px;max-height:170px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:9px}.subject-option{display:flex!important;align-items:center;gap:7px;font-size:12px!important;font-weight:500!important;margin:0!important;cursor:pointer}.subject-option input{accent-color:var(--blue)}.typegrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.typeoption{position:relative}.typeoption input{position:absolute;opacity:0}.typeoption span{display:block;border:1px solid var(--line);border-radius:10px;padding:10px 11px;font-size:13px;cursor:pointer}.typeoption input:checked+span{border-color:var(--blue);background:#f1f3ff;color:#334ec3;font-weight:700}.modalfoot{display:flex;justify-content:flex-end;gap:9px;margin-top:22px}.remove{margin-right:auto;color:#bd4545}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#202b3b;color:white;padding:11px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:.2s;font-size:13px}.toast.show{opacity:1}@media(max-width:800px){.layout{grid-template-columns:1fr}.day{min-height:90px}.sidecard{order:2}}@media(max-width:540px){.app{padding:20px 12px 40px}.top{align-items:flex-start}.brand h1{font-size:18px}.top-actions .button:not(.primary){display:none}.calendar{padding:7px}.day{min-height:76px;padding:5px 3px}.num{width:22px;height:22px;font-size:11px}.event{font-size:9px;padding:4px 3px}.weekdays{font-size:9px}.headrow h2{font-size:20px}.monthnav{gap:7px}.monthnav strong{min-width:110px;font-size:13px}}
</style></head>
<body><main class="app"><header class="top"><div class="brand"><div class="logo">1B</div><div><div class="eyebrow">Twój szkolny planer</div><h1>Planer 1B TECH</h1></div></div><div class="top-actions"><button class="button" id="todayBtn">Dzisiaj</button><button class="button primary" id="addBtn"><span class="plus">＋</span> Dodaj</button></div></header>
<div class="headrow"><h2 id="monthTitle"></h2><div class="monthnav"><button class="iconbtn" id="prev" aria-label="Poprzedni miesiąc">‹</button><strong id="monthLabel"></strong><button class="iconbtn" id="next" aria-label="Następny miesiąc">›</button></div></div>
<div class="layout"><section><div class="calendar"><div class="weekdays"><span>Pn</span><span>Wt</span><span>Śr</span><span>Czw</span><span>Pt</span><span>Sob</span><span>Nd</span></div><div class="days" id="days"></div></div><div class="legend"><span><i class="dot"></i>Kartkówka</span><span><i class="dot orange"></i>Sprawdzian</span><span><i class="dot purple"></i>Praca klasowa</span><span><i class="dot green"></i>Poprawa</span><span><i class="dot sky"></i>Przedmiot lekcji</span></div><div class="hint">Kliknij dzień w kalendarzu, aby dodać wydarzenie.</div></section><aside class="sidecard"><h3>Nadchodzące</h3><div class="subtle">Najbliższe wydarzenia</div><div class="upcoming" id="upcoming"></div></aside></div></main>
<div class="overlay" id="overlay"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modalhead"><div><h2 id="modalTitle">Dodaj wydarzenie</h2><div class="subtle">Zapisz ważną datę w planerze</div></div><button class="close" id="close" aria-label="Zamknij">×</button></div><form id="eventForm"><div class="field"><label>Rodzaj wydarzenia</label><div class="typegrid"><label class="typeoption"><input type="radio" name="type" value="Kartkówka" checked><span>Kartkówka</span></label><label class="typeoption"><input type="radio" name="type" value="Sprawdzian"><span>Sprawdzian</span></label><label class="typeoption"><input type="radio" name="type" value="Praca klasowa"><span>Praca klasowa</span></label><label class="typeoption"><input type="radio" name="type" value="Poprawa"><span>Poprawa</span></label></div></div><div class="field" id="subjectField"><label>Przedmiot lekcji <span class="subtle">(możesz wybrać kilka)</span></label><div class="subject-list" id="subjectList"></div></div><div class="field"><label for="eventTitle">Nazwa / temat</label><input id="eventTitle" placeholder="Np. rozdział 3, dział: funkcje" maxlength="70"></div><div class="field"><label for="eventDate">Dzień</label><input id="eventDate" type="date" required></div><div class="modalfoot"><button class="button remove" type="button" id="deleteBtn" hidden>Usuń</button><button class="button" type="button" id="cancel">Anuluj</button><button class="button primary" type="submit">Zapisz</button></div></form></section></div><div class="toast" id="toast"></div>
<script>
const key='planer1b-events-v1', polishMonths=['styczeń','luty','marzec','kwiecień','maj','czerwiec','lipiec','sierpień','wrzesień','październik','listopad','grudzień'], polishDays=['Nd','Pn','Wt','Śr','Czw','Pt','Sob'];
const subjects=['j. angielski','j. niemiecki','j. polski','matematyka','fizyka','chemia','biologia','historia','geografia','informatyka','wf','religia','edb','działalność gospodarcza','podstawy grafiki','pracownia baz danych','podstawy informatyki','podstawy poligrafii','biznes i zarządzanie','edukacja zdrowotna','zajęcia wychowawcze'];
let events=JSON.parse(localStorage.getItem(key)||'[]').map(e=>e.type==='Lekcja'?{...e,type:'Kartkówka',subjects:e.subjects||(e.subject?[e.subject]:[])}:e), cursor=new Date(), editing=null;
const $=id=>document.getElementById(id), pad=n=>String(n).padStart(2,'0'), iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
$('subjectList').innerHTML=subjects.map((s,i)=>`<label class="subject-option"><input type="checkbox" value="${s}" id="sub${i}">${s}</label>`).join('');
function getSubjects(e){return e?.subjects|| (e?.subject?[e.subject]:[])}
function render(){const y=cursor.getFullYear(),m=cursor.getMonth(),first=new Date(y,m,1),offset=(first.getDay()+6)%7,start=new Date(y,m,1-offset),days=$('days');$('monthLabel').textContent=polishMonths[m]+' '+y;$('monthTitle').textContent=polishMonths[m][0].toUpperCase()+polishMonths[m].slice(1)+' '+y;days.innerHTML='';for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const cell=document.createElement('div');cell.className='day'+(d.getMonth()!==m?' other':'')+(iso(d)===iso(new Date())?' today':'');cell.innerHTML=`<div class="num">${d.getDate()}</div>`;const list=events.filter(e=>e.date===iso(d)).slice(0,3);for(const e of list){const el=document.createElement('div');el.className='event '+(e.type==='Sprawdzian'?'sprawdzian':e.type==='Praca klasowa'?'praca':e.type==='Poprawa'?'poprawa':'');const selected=getSubjects(e);el.textContent=e.type+(selected.length?' · '+selected.join(', '):'')+(e.title?' · '+e.title:'');el.title=el.textContent;el.onclick=ev=>{ev.stopPropagation();openModal(d,e.id)};cell.appendChild(el)}if(events.filter(e=>e.date===iso(d)).length>3){let more=document.createElement('div');more.className='subtle';more.textContent=`+${events.filter(e=>e.date===iso(d)).length-3} więcej`;cell.appendChild(more)}cell.onclick=()=>openModal(d);days.appendChild(cell)}renderUpcoming()}
function renderUpcoming(){const box=$('upcoming'),now=iso(new Date());const arr=events.filter(e=>e.date>=now).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,6);box.innerHTML='';if(!arr.length){box.innerHTML='<div class="empty">Brak wydarzeń. Dodaj pierwsze przez przycisk „Dodaj”.</div>';return}arr.forEach(e=>{const d=new Date(e.date+'T00:00:00'),row=document.createElement('div'),selected=getSubjects(e);row.className='upcoming-item';row.innerHTML=`<div class="datebox"><span>${polishDays[d.getDay()]}</span><b>${d.getDate()}</b></div><div><strong>${e.type}${selected.length?' · '+selected.join(', '):''}</strong><small>${e.title||'Wydarzenie'} · ${pad(d.getDate())}.${pad(d.getMonth()+1)}</small></div>`;row.onclick=()=>openModal(d,e.id);row.style.cursor='pointer';box.appendChild(row)})}
function openModal(date=new Date(),id=null){editing=id;const e=id?events.find(x=>x.id===id):null;$('eventForm').reset();document.querySelector(`input[name="type"][value="${e?.type||'Kartkówka'}"]`).checked=true;$('eventDate').value=e?.date||iso(date);$('eventTitle').value=e?.title||'';const chosen=getSubjects(e);document.querySelectorAll('#subjectList input').forEach(c=>c.checked=chosen.includes(c.value));$('deleteBtn').hidden=!e;$('modalTitle').textContent=e?'Edytuj wydarzenie':'Dodaj wydarzenie';$('overlay').classList.add('open');setTimeout(()=>$('eventTitle').focus(),30)}function closeModal(){$('overlay').classList.remove('open');editing=null}function toast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2200)}
$('addBtn').onclick=()=>openModal();$('close').onclick=$('cancel').onclick=closeModal;$('overlay').onclick=e=>{if(e.target===$('overlay'))closeModal()};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});$('prev').onclick=()=>{cursor.setMonth(cursor.getMonth()-1);render()};$('next').onclick=()=>{cursor.setMonth(cursor.getMonth()+1);render()};$('todayBtn').onclick=()=>{cursor=new Date();render()};$('eventForm').onsubmit=e=>{e.preventDefault();const type=document.querySelector('input[name="type"]:checked').value,selected=[...document.querySelectorAll('#subjectList input:checked')].map(c=>c.value);const item={id:editing||String(Date.now()),type,date:$('eventDate').value,title:$('eventTitle').value.trim(),subjects:selected};if(editing)events=events.map(x=>x.id===editing?item:x);else events.push(item);localStorage.setItem(key,JSON.stringify(events));cursor=new Date(item.date+'T00:00:00');closeModal();render();toast(editing?'Wydarzenie zmieniono':'Wydarzenie dodano')};$('deleteBtn').onclick=()=>{if(!editing)return;events=events.filter(e=>e.id!==editing);localStorage.setItem(key,JSON.stringify(events));closeModal();render();toast('Wydarzenie usunięto')};render();
</script></body></html>
